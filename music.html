<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>JH Music</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: transparent;
      font-family: 'Segoe UI', system-ui, Arial, sans-serif;
      color: #eef1f8;
    }

    #app {
      min-height: 100vh;
      display: flex;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 18px 12px;
    }

    .card {
      margin: auto;
      width: 100%;
      max-width: 440px;
      background: linear-gradient(160deg, rgba(52, 211, 153, .08), rgba(255, 255, 255, .03) 45%, rgba(34, 211, 238, .07));
      border: 1px solid rgba(226, 232, 240, .12);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 30px 60px -25px rgba(0, 0, 0, .7);
    }

    .head {
      padding: 16px 18px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(226, 232, 240, .08);
      background: linear-gradient(90deg, rgba(52, 211, 153, .12), rgba(34, 211, 238, .10));
    }

    .brand {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #34d399, #22d3ee, #e2e8f0, #34d399);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: shine 6s linear infinite;
    }

    .title {
      margin-top: 2px;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 12px rgba(34, 211, 238, .4);
    }

    .live {
      font-size: 9px;
      letter-spacing: 2px;
      color: #34d399;
      font-weight: 700;
    }

    .live i {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
      margin-right: 4px;
      animation: pulse 1.2s infinite;
    }

    .body {
      padding: 20px 18px 6px;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .vinyl {
      position: relative;
      width: 110px;
      height: 110px;
      flex: none;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(226, 232, 240, .15);
      box-shadow: 0 0 24px rgba(52, 211, 153, .25);
      background: radial-gradient(circle, #0a0f14 0%, #05070d 70%);
      animation: spin 7s linear infinite;
      animation-play-state: paused;
    }

    .playing .vinyl {
      animation-play-state: running;
    }

    .vinyl img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hole {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      margin: -8px;
      border-radius: 50%;
      background: #05070d;
      border: 2px solid rgba(226, 232, 240, .25);
    }

    .meta {
      flex: 1;
      min-width: 0;
    }

    .t {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .a {
      margin-top: 3px;
      font-size: 11px;
      color: rgba(226, 232, 240, .6);
    }

    .chips {
      margin-top: 10px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chips span {
      font-size: 9px;
      letter-spacing: 1px;
      padding: 4px 8px;
      border-radius: 20px;
      border: 1px solid rgba(52, 211, 153, .35);
      color: #34d399;
      background: rgba(52, 211, 153, .08);
    }

    .chips span.cy {
      border-color: rgba(34, 211, 238, .35);
      color: #22d3ee;
      background: rgba(34, 211, 238, .08);
    }

    .eq {
      display: flex;
      gap: 4px;
      justify-content: center;
      align-items: flex-end;
      height: 26px;
      padding: 14px 0 4px;
    }

    .eq i {
      width: 4px;
      border-radius: 2px;
      background: linear-gradient(180deg, #22d3ee, #34d399);
      animation: eq 1s ease-in-out infinite;
      animation-play-state: paused;
    }

    .playing .eq i {
      animation-play-state: running;
    }

    .eq i:nth-child(1) { height: 40%; }
    .eq i:nth-child(2) { animation-delay: .15s; height: 80%; }
    .eq i:nth-child(3) { animation-delay: .3s;  height: 60%; }
    .eq i:nth-child(4) { animation-delay: .45s; height: 90%; }
    .eq i:nth-child(5) { height: 50%; }

    .player {
      padding: 4px 18px 14px;
    }

    .times {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: rgba(226, 232, 240, .5);
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .bar {
      height: 6px;
      border-radius: 3px;
      background: rgba(226, 232, 240, .12);
      overflow: hidden;
      cursor: pointer;
      touch-action: manipulation;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #34d399, #22d3ee);
      border-radius: 3px;
    }

    .ctrl {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 12px;
    }

    .pbtn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #34d399, #22d3ee);
      color: #05070d;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(52, 211, 153, .35);
      touch-action: manipulation;
    }

    .sbtn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(226, 232, 240, .15);
      background: rgba(255, 255, 255, .05);
      color: rgba(226, 232, 240, .7);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .savewrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    .st {
      font-size: 9px;
      color: rgba(226, 232, 240, .45);
    }

    .foot {
      padding: 12px 16px 16px;
      border-top: 1px solid rgba(226, 232, 240, .08);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(0, 0, 0, .25);
    }

    .made, .powered {
      font-size: 11px;
      color: rgba(226, 232, 240, .66);
    }

    .heart {
      display: inline-block;
      color: #fb7185;
      animation: beat 1.1s infinite;
    }

    .jh {
      font-weight: 700;
      background: linear-gradient(90deg, #34d399, #22d3ee, #e2e8f0, #34d399);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: shine 5s linear infinite;
    }

    .fiony {
      font-weight: 700;
      background: linear-gradient(90deg, #22d3ee, #a5f3fc, #34d399, #22d3ee);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: shine 4.5s linear infinite;
    }

    .copy {
      font-size: 9.5px;
      color: rgba(226, 232, 240, .34);
      letter-spacing: .8px;
      margin-top: 3px;
    }

    @keyframes shine { to { background-position: 300% 0; } }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    @keyframes eq    { 0%, 100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }
    @keyframes beat  { 0%, 100% { transform: scale(1); } 30% { transform: scale(1.4); } 55% { transform: scale(1); } 75% { transform: scale(1.25); } }
  </style>
</head>
<body>
  <div id="app">
    <div class="card" id="card">

      <div class="head">
        <div>
          <div class="brand">JH • MUSIC</div>
          <div class="title">Now Playing</div>
        </div>
        <div class="live"><i></i>STREAMING</div>
      </div>

      <div class="body">
        <div class="vinyl" id="vinyl">
          <img id="art" src="__JH_THUMB__" alt="" onerror="this.style.display='none'">
          <div class="hole"></div>
        </div>
        <div class="meta">
          <div class="t">__JH_TITLE__</div>
          <div class="a">__JH_ARTIST__</div>
          <div class="chips">
            <span>⏱ __JH_DURATION__</span>
            <span class="cy">🎧 MP3</span>
            <span>▶ YOUTUBE</span>
          </div>
        </div>
      </div>

      <div class="eq"><i></i><i></i><i></i><i></i><i></i></div>

      <div class="player">
        <div class="times">
          <span id="tcur">0:00</span>
          <span id="tdur">0:00</span>
        </div>
        <div class="bar" id="bar">
          <div class="fill" id="fill"></div>
        </div>
        <div class="ctrl">
          <button class="sbtn" id="m10">-10</button>
          <button class="pbtn" id="pbtn">▶</button>
          <button class="sbtn" id="p10">+10</button>
        </div>
        <div class="savewrap">
          <span class="st" id="st">__JH_NOTE__</span>
        </div>
      </div>

      <div class="foot" data-jh-fiony-anchor="1">
        <div class="made">Made with <span class="heart">♡</span> by <span class="jh" data-jh-credit="1">JamvanHax0r</span></div>
        <div class="powered">Powered by <span class="fiony" data-jh-credit="2">Fiony Bot</span></div>
        <div class="copy">© <span id="year"></span> — All Rights Reserved.</div>
      </div>

    </div>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

  <script>
    var audioB64 = "__JH_AUDIO__";
    var ctx = null, audioBuffer = null, sourceNode = null, startTime = 0, pauseOffset = 0, isPlaying = false, rafId = null;

    var card = document.getElementById('card');
    var vinyl = document.getElementById('vinyl');
    var pbtn = document.getElementById('pbtn');
    var bar = document.getElementById('bar');
    var fill = document.getElementById('fill');
    var tcur = document.getElementById('tcur');
    var tdur = document.getElementById('tdur');
    var st = document.getElementById('st');

    function fmt(s) {
      if (!isFinite(s) || s <= 0) return '0:00';
      var m = Math.floor(s / 60);
      var ss = Math.floor(s % 60);
      return m + ':' + (ss < 10 ? '0' : '') + ss;
    }

    function setStatus(t) { st.textContent = t; }

    function b64ToAB(b64) {
      var pure = b64.split(',')[1] || b64;
      var bin = atob(pure);
      var len = bin.length;
      var bytes = new Uint8Array(len);
      for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
      return bytes.buffer;
    }

    async function initAudio() {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        ctx = new AC();
      }
      if (ctx.state === 'suspended') await ctx.resume();
      if (!audioBuffer) {
        setStatus('Loading audio...');
        audioBuffer = await new Promise(function (res, rej) {
          ctx.decodeAudioData(b64ToAB(audioB64), res, rej);
        });
        tdur.textContent = fmt(audioBuffer.duration);
        setStatus('Ready to play');
      }
    }

    function startPlayback(offset) {
      sourceNode = ctx.createBufferSource();
      sourceNode.buffer = audioBuffer;
      sourceNode.connect(ctx.destination);
      sourceNode.onended = function () {
        if (isPlaying && (ctx.currentTime - startTime + pauseOffset >= audioBuffer.duration)) {
          stopPlayback();
        }
      };
      startTime = ctx.currentTime;
      pauseOffset = offset;
      sourceNode.start(0, offset);
      isPlaying = true;
      card.classList.add('playing');
      pbtn.textContent = '⏸';
      setStatus('Playing...');
      tick();
    }

    function stopPlayback() {
      if (sourceNode) {
        try { sourceNode.stop(); } catch (e) {}
        sourceNode = null;
      }
      isPlaying = false;
      pauseOffset = 0;
      card.classList.remove('playing');
      pbtn.textContent = '▶';
      if (rafId) cancelAnimationFrame(rafId);
      fill.style.width = '0%';
      tcur.textContent = '0:00';
      setStatus('Ended - tap ▶');
    }

    function pausePlayback() {
      if (isPlaying && sourceNode) {
        pauseOffset += ctx.currentTime - startTime;
        try { sourceNode.stop(); } catch (e) {}
        sourceNode = null;
      }
      isPlaying = false;
      card.classList.remove('playing');
      pbtn.textContent = '▶';
      if (rafId) cancelAnimationFrame(rafId);
      setStatus('Paused');
    }

    function tick() {
      if (!isPlaying || !audioBuffer) return;
      var current = pauseOffset + (ctx.currentTime - startTime);
      var total = audioBuffer.duration;
      if (current >= total) {
        stopPlayback();
        return;
      }
      fill.style.width = ((current / total) * 100) + '%';
      tcur.textContent = fmt(current);
      rafId = requestAnimationFrame(tick);
    }

    var lastAct = 0;
    function onAct(e) {
      var t = e.target;
      if (!t || !t.closest) return;
      var el = t.closest('#pbtn,#m10,#p10,#bar');
      if (!el) return;
      e.preventDefault();
      var now = Date.now();
      if (now - lastAct < 400) return;
      lastAct = now;

      if (el.id === 'pbtn') {
        (async () => {
          try {
            await initAudio();
            if (!isPlaying) {
              startPlayback(pauseOffset);
            } else {
              pausePlayback();
            }
          } catch (err) {
            setStatus('Error: ' + (err.name || 'play'));
          }
        })();
      } else if (el.id === 'm10') {
        if (audioBuffer) {
          var newOffset = Math.max(0, pauseOffset + (isPlaying ? (ctx.currentTime - startTime) : 0) - 10);
          if (isPlaying) {
            try { sourceNode.stop(); } catch (e) {}
            sourceNode = null;
            startPlayback(newOffset);
          } else {
            pauseOffset = newOffset;
            fill.style.width = ((newOffset / audioBuffer.duration) * 100) + '%';
            tcur.textContent = fmt(newOffset);
          }
        }
      } else if (el.id === 'p10') {
        if (audioBuffer) {
          var newOffset = Math.min(audioBuffer.duration, pauseOffset + (isPlaying ? (ctx.currentTime - startTime) : 0) + 10);
          if (isPlaying) {
            try { sourceNode.stop(); } catch (e) {}
            sourceNode = null;
            startPlayback(newOffset);
          } else {
            pauseOffset = newOffset;
            fill.style.width = ((newOffset / audioBuffer.duration) * 100) + '%';
            tcur.textContent = fmt(newOffset);
          }
        }
      } else if (el.id === 'bar') {
        if (audioBuffer) {
          var cx = e.clientX;
          if (e.changedTouches && e.changedTouches[0]) cx = e.changedTouches[0].clientX;
          var r = bar.getBoundingClientRect();
          var ratio = (cx - r.left) / r.width;
          var newOffset = ratio * audioBuffer.duration;
          if (isPlaying) {
            try { sourceNode.stop(); } catch (e) {}
            sourceNode = null;
            startPlayback(newOffset);
          } else {
            pauseOffset = newOffset;
            fill.style.width = (ratio * 100) + '%';
            tcur.textContent = fmt(newOffset);
          }
        }
      }
    }

    document.addEventListener('click', onAct);
    document.addEventListener('touchend', onAct);

    setStatus('Ready to play');
  </script>

  <script>

      var _k = 'JHFIONY2026';

          '<div class="made">' + _t[2] + '<span class="heart">♡</span>' + _t[3] +

          if (m) m.innerHTML = _t[2] + '<span class="heart">♡</span>' + _t[3] + '<span class="jh" data-jh-credit="1">' + _d(_jh) + '</span>';
          if (p) p.innerHTML = _t[4] + '<span class="fiony" data-jh-credit="2">' + _d(_fy) + '</span>';

  </script>
</body>
</html>
